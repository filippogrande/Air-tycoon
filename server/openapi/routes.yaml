openapi: 3.0.0
info:
  title: Air Tycoon 2 API - Routes
  version: 1.0.0
  description: |
    API per la gestione delle rotte e dei voli.
paths:
  /api/routes/company/{company_id}:
    get:
      tags: [Routes]
      summary: Ottieni tutte le rotte di una compagnia
      parameters:
        - in: path
          name: company_id
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Lista rotte
  /api/routes/{id}:
    get:
      tags: [Routes]
      summary: Ottieni dettagli di una rotta
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Dettagli rotta e ultimi voli
    put:
      tags: [Routes]
      summary: Aggiorna una rotta
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                base_price:
                  type: number
                frequency_per_week:
                  type: integer
                status:
                  type: string
      responses:
        "200":
          description: Rotta aggiornata
    delete:
      tags: [Routes]
      summary: Elimina una rotta
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Rotta eliminata
  /api/routes:
    post:
      tags: [Routes]
      summary: Crea una nuova rotta
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                company_id:
                  type: integer
                origin_airport_id:
                  type: integer
                destination_airport_id:
                  type: integer
                distance_km:
                  type: number
                base_price:
                  type: number
                frequency_per_week:
                  type: integer
      responses:
        "201":
          description: Rotta creata
  /api/routes/{id}/schedule:
    post:
      tags: [Routes]
      summary: Programma un volo su una rotta
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                aircraft_id:
                  type: integer
                departure_time:
                  type: string
                  format: date-time
                passenger_load:
                  type: number
      responses:
        "201":
          description: Volo programmato
  /api/routes/analysis/{company_id}:
    get:
      tags: [Routes]
      summary: Analisi performance rotte di una compagnia
      parameters:
        - in: path
          name: company_id
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Analisi performance rotte
  /api/routes/countries_count:
    post:
      tags: [Routes]
      summary: Conta le nazioni sorvolate tra due aeroporti
      description: |
        Restituisce il numero e la lista dei codici paese (ISO 3166-1 alpha-2) sorvolati da una rotta tra due aeroporti, calcolando punti intermedi ogni ~50 km e arrotondando le coordinate a 1 decimale (~11 km). Le richieste a Nominatim sono rate-limited a 1 richiesta/secondo e viene usata una cache locale per ridurre le chiamate.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                origin_iata:
                  type: string
                  description: Codice IATA aeroporto di partenza
                destination_iata:
                  type: string
                  description: Codice IATA aeroporto di arrivo
              required:
                - origin_iata
                - destination_iata
      responses:
        "200":
          description: Lista dei paesi sorvolati e conteggio
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  countries:
                    type: array
                    items:
                      type: string
                    description: Lista codici paese (ISO 3166-1 alpha-2)
                  count:
                    type: integer
                    description: Numero di paesi sorvolati
        "400":
          description: Parametri mancanti o non validi
        "404":
          description: Aeroporti non trovati
        "500":
          description: Errore interno o errore calcolo
