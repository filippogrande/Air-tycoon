openapi: 3.0.0
info:
  title: Air Tycoon 2 API - Auth
  version: 1.0.0
  description: |
    API relative ad autenticazione e registrazione utenti.
paths:
  /api/auth/register:
    post:
      tags: [Auth]
      summary: Registra un nuovo utente
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                email:
                  type: string
                password:
                  type: string
      responses:
        "200":
          description: Utente registrato
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  message:
                    type: string
                  data:
                    type: object
                    properties:
                      userId:
                        type: string
                      email:
                        type: string
  /api/auth/login:
    post:
      tags: [Auth]
      summary: Effettua il login
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                email:
                  type: string
                password:
                  type: string
      responses:
        "200":
          description: Login effettuato
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  message:
                    type: string
                  data:
                    type: object
                    properties:
                      userId:
                        type: string
                      email:
                        type: string
                      createdAt:
                        type: string
                      lastLogin:
                        type: string
  /api/auth/verify:
    get:
      tags: [Auth]
      summary: Verifica token/sessione (placeholder)
      responses:
        "200":
          description: Token verificato (placeholder)
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  message:
                    type: string
