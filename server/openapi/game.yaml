openapi: 3.0.0
info:
  title: Air Tycoon 2 API - Game
  version: 1.0.0
  description: |
    API relative a compagnie, gioco, flotta e dati fondamentali.
paths:
  /api/game/companies:
    get:
      tags: [Game]
      summary: Ottieni tutte le compagnie
      responses:
        "200":
          description: Lista compagnie
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  data:
                    type: array
                    items:
                      $ref: "#/components/schemas/Company"
  /api/game/companies/{id}:
    get:
      tags: [Game]
      summary: Dettagli di una compagnia
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Dettagli compagnia
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  data:
                    $ref: "#/components/schemas/CompanyDetails"
  /api/game/companies/create-or-update:
    post:
      tags: [Game]
      summary: Crea o aggiorna una compagnia (upsert)
      description: |
        Crea o aggiorna una compagnia. `founded` è obbligatorio e viene usato anche come `game_date` e come `established_date` dell'hub principale se la compagnia è nuova.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, user_id, founded, base_airport]
              properties:
                id:
                  type: string
                  format: uuid
                  description: "UUID compagnia (opzionale, per aggiornamento)"
                name:
                  type: string
                money:
                  type: number
                reputation:
                  type: number
                founded:
                  type: string
                  format: date-time
                base_airport:
                  type: string
                  format: uuid
                base_airport_code:
                  type: string
                user_id:
                  type: string
            example:
              name: "Air Tycoon"
              money: 1000000
              reputation: 50
              founded: "2025-06-29T12:00:00Z"
              base_airport: "513d3b10-b1bd-4de6-ac3c-27de4efc692c"
              user_id: "user-123"
      responses:
        "200":
          description: Compagnia creata o aggiornata
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  data:
                    $ref: "#/components/schemas/Company"
                  action:
                    type: string
              example:
                success: true
                data:
                  id: 1
                  name: "Air Tycoon"
                  money: 1000000
                  reputation: 50
                  base_airport: 1
                  founded: "2025-06-29T12:00:00Z"
                  game_date: "2025-06-29T12:00:00Z"
                action: "created"
        "400":
          description: Parametri mancanti o errati
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  error:
                    type: string
              example:
                success: false
                error: "Name is required"
        "500":
          description: Errore server
  /api/game/companies/{id}/hubs:
    get:
      tags: [Game]
      summary: Ottieni tutti gli aeroporti hub della compagnia
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Lista hub
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  data:
                    type: array
                    items:
                      $ref: "#/components/schemas/Airport"
        "500":
          description: Errore server
  /api/game/aircraft-data:
    get:
      tags: [Game]
      summary: Restituisce tutti i tipi di aeromobile disponibili
      responses:
        "200":
          description: Lista tipi di aeromobile
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  data:
                    type: array
                    items:
                      $ref: "#/components/schemas/AircraftType"
components:
  schemas:
    Company:
      type: object
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        money:
          type: number
        reputation:
          type: number
        base_airport:
          type: string
          format: uuid
        user_id:
          type: string
        founded:
          type: string
          format: date-time
        game_date:
          type: string
          format: date-time
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
    CompanyDetails:
      allOf:
        - $ref: "#/components/schemas/Company"
        - type: object
          properties:
            fleet:
              type: array
              items:
                type: object
            routes:
              type: array
              items:
                type: object
            financials:
              type: array
              items:
                type: object
    AircraftType:
      type: object
      properties:
        id:
          type: integer
        name:
          type: string
        manufacturer:
          type: string
        capacity:
          type: integer
        range_km:
          type: integer
        fuel_consumption:
          type: number
    Airport:
      type: object
      properties:
        id:
          type: integer
        name:
          type: string
        iata_code:
          type: string
        icao_code:
          type: string
        city:
          type: string
        country:
          type: string
        latitude:
          type: number
        longitude:
          type: number
