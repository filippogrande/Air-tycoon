openapi: 3.0.0
info:
  title: Air Tycoon 2 API
  version: 1.0.0
  description: |
    Documentazione interattiva delle API di Air Tycoon 2.

    Tutte le rotte principali sono documentate qui. Puoi testare le chiamate direttamente da questa pagina.
servers:
  - url: http://localhost:3001
tags:
  - name: Game
    description: Operazioni relative al gioco e alle compagnie
  - name: Auth
    description: Autenticazione e registrazione
  - name: Airports
    description: Informazioni sugli aeroporti
  - name: Fleet
    description: Gestione della flotta e aeromobili
  - name: Finance
    description: Operazioni finanziarie e report
  - name: System
    description: Endpoint di sistema e info
  - name: Admin
    description: Operazioni amministrative e statistiche database
  - name: MarketAnalysis
    description: Analisi di mercato e miglioramenti domanda
  - name: Routes
    description: Gestione delle rotte e voli
paths:
  /api/game/companies:
    get:
      tags: [Game]
      summary: Ottieni tutte le compagnie
      responses:
        "200":
          description: Lista compagnie
    post:
      tags: [Game]
      summary: Crea nuova compagnia e hub principale
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                headquarters_airport_id:
                  type: integer
                user_id:
                  type: string
      responses:
        "201":
          description: Compagnia creata
  /api/game/companies/{id}:
    get:
      tags: [Game]
      summary: Dettagli di una compagnia
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Dettagli compagnia
    put:
      tags: [Game]
      summary: Aggiorna una compagnia
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                money:
                  type: number
                reputation:
                  type: number
      responses:
        "200":
          description: Compagnia aggiornata
  /api/game/save/{id}:
    get:
      tags: [Game]
      summary: Carica un salvataggio specifico
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Dati salvataggio
  /api/game/save:
    post:
      tags: [Game]
      summary: Salva una partita (crea o aggiorna un salvataggio)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                company_id:
                  type: integer
                save_name:
                  type: string
                game_data:
                  type: object
      responses:
        "200":
          description: Salvataggio effettuato
  /api/game/saves/{company_id}:
    get:
      tags: [Game]
      summary: Lista di tutti i salvataggi per una compagnia
      parameters:
        - in: path
          name: company_id
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Lista salvataggi
  /api/game/companies/{id}/latest-save:
    get:
      tags: [Game]
      summary: Ottieni l'ultimo salvataggio per una compagnia
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Ultimo salvataggio trovato
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  data:
                    type: object
              example:
                success: true
                data:
                  id: 12
                  company_id: 1
                  save_name: "Partita 1"
                  game_data: { "score": 100 }
                  updated_at: "2025-06-29T12:00:00Z"
        "404":
          description: Nessun salvataggio trovato
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  error:
                    type: string
              example:
                success: false
                error: "Nessun salvataggio trovato per questa compagnia"
        "500":
          description: Errore server
  /api/game/companies/create-or-update:
    post:
      tags: [Game]
      summary: Crea o aggiorna una compagnia (upsert)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                id:
                  type: integer
                  description: "ID compagnia (opzionale, per aggiornamento)"
                name:
                  type: string
                money:
                  type: number
                reputation:
                  type: number
                founded:
                  type: string
                  format: date-time
                base_airport:
                  type: integer
                base_airport_code:
                  type: string
            example:
              name: "Air Tycoon"
              money: 1000000
              reputation: 50
              founded: "2025-06-29T12:00:00Z"
              base_airport: 1
      responses:
        "200":
          description: Compagnia creata o aggiornata
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  data:
                    type: object
                  action:
                    type: string
              example:
                success: true
                data:
                  id: 1
                  name: "Air Tycoon"
                  money: 1000000
                  reputation: 50
                  base_airport: 1
                action: "created"
        "400":
          description: Parametri mancanti o errati
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  error:
                    type: string
              example:
                success: false
                error: "Name is required"
        "500":
          description: Errore server
  /api/airports:
    get:
      tags: [Airports]
      summary: Lista aeroporti (filtrabile)
      parameters:
        - in: query
          name: country
          schema:
            type: string
        - in: query
          name: search
          schema:
            type: string
        - in: query
          name: continent
          schema:
            type: string
        - in: query
          name: size
          schema:
            type: string
        - in: query
          name: before
          schema:
            type: string
        - in: query
          name: limit
          schema:
            type: integer
      responses:
        "200":
          description: Lista aeroporti
  /api/airports/{id}:
    get:
      tags: [Airports]
      summary: Dettagli di un aeroporto
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Dettagli aeroporto
  /api/airports/near/{lat}/{lng}:
    get:
      tags: [Airports]
      summary: Trova aeroporti vicini
      parameters:
        - in: path
          name: lat
          required: true
          schema:
            type: number
        - in: path
          name: lng
          required: true
          schema:
            type: number
        - in: query
          name: radius
          schema:
            type: integer
        - in: query
          name: limit
          schema:
            type: integer
      responses:
        "200":
          description: Lista aeroporti vicini
  /api/airports/countries:
    get:
      tags: [Airports]
      summary: Lista paesi con aeroporti
      responses:
        "200":
          description: Lista paesi
  /api/auth/register:
    post:
      tags: [Auth]
      summary: Registra un nuovo utente
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                email:
                  type: string
                password:
                  type: string
      responses:
        "200":
          description: Utente registrato
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  message:
                    type: string
                  data:
                    type: object
                    properties:
                      userId:
                        type: string
                      email:
                        type: string
  /api/auth/login:
    post:
      tags: [Auth]
      summary: Effettua il login
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                email:
                  type: string
                password:
                  type: string
      responses:
        "200":
          description: Login effettuato
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  message:
                    type: string
                  data:
                    type: object
                    properties:
                      userId:
                        type: string
                      email:
                        type: string
                      createdAt:
                        type: string
                      lastLogin:
                        type: string
  /api/auth/verify:
    get:
      tags: [Auth]
      summary: Verifica token/sessione (placeholder)
      responses:
        "200":
          description: Token verificato (placeholder)
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  message:
                    type: string
  /api/admin/tables:
    get:
      tags: [Admin]
      summary: Lista tutte le tabelle disponibili
      responses:
        "200":
          description: Lista tabelle
  /api/admin/tables/{tableName}:
    get:
      tags: [Admin]
      summary: Visualizza contenuto di una tabella
      parameters:
        - in: path
          name: tableName
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Contenuto tabella
  /api/admin/schema/{tableName}:
    get:
      tags: [Admin]
      summary: Mostra schema di una tabella
      parameters:
        - in: path
          name: tableName
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Schema tabella
  /api/admin/stats:
    get:
      tags: [Admin]
      summary: Statistiche generali del database
      responses:
        "200":
          description: Statistiche database
  /health:
    get:
      tags: [System]
      summary: Health check del server
      description: Restituisce lo stato del server e la versione.
      responses:
        "200":
          description: Server attivo
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                  timestamp:
                    type: string
                  version:
                    type: string
  /:
    get:
      tags: [System]
      summary: Redirect al gioco
      description: Reindirizza a /game/index.html
      responses:
        "302":
          description: Redirect
  /docs:
    get:
      tags: [System]
      summary: Documentazione Swagger interattiva
      description: Mostra la documentazione interattiva delle API.
      responses:
        "200":
          description: Pagina Swagger UI
  /api/finance/company/{company_id}:
    get:
      tags: [Finance]
      summary: Ottieni record finanziari di una compagnia
      parameters:
        - in: path
          name: company_id
          required: true
          schema:
            type: integer
        - in: query
          name: start_date
          schema:
            type: string
        - in: query
          name: end_date
          schema:
            type: string
        - in: query
          name: category
          schema:
            type: string
        - in: query
          name: type
          schema:
            type: string
        - in: query
          name: limit
          schema:
            type: integer
      responses:
        "200":
          description: Lista record finanziari
  /api/finance/summary/{company_id}:
    get:
      tags: [Finance]
      summary: Ottieni riassunto finanziario
      parameters:
        - in: path
          name: company_id
          required: true
          schema:
            type: integer
        - in: query
          name: period
          schema:
            type: string
      responses:
        "200":
          description: Riassunto finanziario
  /api/finance/transaction:
    post:
      tags: [Finance]
      summary: Aggiungi transazione finanziaria
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                company_id:
                  type: integer
                type:
                  type: string
                amount:
                  type: number
                description:
                  type: string
                category:
                  type: string
                flight_id:
                  type: integer
                aircraft_id:
                  type: integer
      responses:
        "201":
          description: Transazione aggiunta
  /api/finance/profit-loss/{company_id}:
    get:
      tags: [Finance]
      summary: Report profitti e perdite
      parameters:
        - in: path
          name: company_id
          required: true
          schema:
            type: integer
        - in: query
          name: start_date
          schema:
            type: string
        - in: query
          name: end_date
          schema:
            type: string
      responses:
        "200":
          description: Report profitti e perdite
  /api/finance/cash-flow/{company_id}:
    get:
      tags: [Finance]
      summary: Report flusso di cassa
      parameters:
        - in: path
          name: company_id
          required: true
          schema:
            type: integer
        - in: query
          name: months
          schema:
            type: integer
      responses:
        "200":
          description: Report flusso di cassa
  /api/fleet/aircraft-types:
    get:
      tags: [Fleet]
      summary: Ottieni tutti i tipi di aeromobili disponibili
      responses:
        "200":
          description: Lista tipi aeromobili
  /api/fleet/company/{company_id}:
    get:
      tags: [Fleet]
      summary: Ottieni la flotta di una compagnia
      parameters:
        - in: path
          name: company_id
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Flotta compagnia
  /api/fleet/purchase:
    post:
      tags: [Fleet]
      summary: Acquista nuovo aeromobile
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                company_id:
                  type: integer
                aircraft_type_id:
                  type: integer
                registration:
                  type: string
                purchase_price:
                  type: number
      responses:
        "201":
          description: Aeromobile acquistato
  /api/fleet/{id}:
    put:
      tags: [Fleet]
      summary: Aggiorna aeromobile
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                condition:
                  type: number
                total_flight_hours:
                  type: number
                location_airport_id:
                  type: integer
                status:
                  type: string
      responses:
        "200":
          description: Aeromobile aggiornato
    delete:
      tags: [Fleet]
      summary: Vendi aeromobile
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                sale_price:
                  type: number
      responses:
        "200":
          description: Aeromobile venduto
  /api/fleet/{id}/maintenance:
    post:
      tags: [Fleet]
      summary: Esegui manutenzione su un aeromobile
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                maintenance_type:
                  type: string
  /api/routes/market-analysis/{origin}/{destination}:
    get:
      tags: [MarketAnalysis]
      summary: Ottieni l'analisi di mercato per una rotta specifica
      parameters:
        - in: path
          name: origin
          required: true
          schema:
            type: string
          description: Codice IATA aeroporto di origine
        - in: path
          name: destination
          required: true
          schema:
            type: string
          description: Codice IATA aeroporto di destinazione
        - in: query
          name: company_id
          required: true
          schema:
            type: integer
        - in: query
          name: analysis_type
          required: false
          schema:
            type: string
            enum: [standard, premium, detailed]
      responses:
        "200":
          description: Analisi trovata o assente
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  has_analysis:
                    type: boolean
                  analysis:
                    type: object
                    nullable: true
              example:
                success: true
                has_analysis: true
                analysis:
                  id: 1
                  type: "standard"
                  cost_paid: 50000
                  results:
                    cost_per_flight: 12000
                    monthly_revenue: 350000
                    estimated_profit: 120000
                    analysis_date: "2025-06-29T12:00:00Z"
                    confidence_level: "medium"
                    market_factors:
                      competition: "medium"
                      demand_trend: "growing"
                      seasonal_variation: 18
                  purchase_date: "2025-06-29T12:00:00Z"
                  expires_at: null
        "400":
          description: Parametri mancanti
        "404":
          description: Aeroporti non trovati
        "500":
          description: Errore server
  /api/routes/market-analysis:
    post:
      tags: [MarketAnalysis]
      summary: Acquista una nuova analisi di mercato
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                company_id:
                  type: integer
                origin_airport_code:
                  type: string
                destination_airport_code:
                  type: string
                analysis_type:
                  type: string
                  enum: [standard, premium, detailed]
                cost:
                  type: number
            example:
              company_id: 1
              origin_airport_code: "FCO"
              destination_airport_code: "JFK"
              analysis_type: "standard"
              cost: 50000
      responses:
        "200":
          description: Analisi acquistata con successo
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  message:
                    type: string
                  analysis:
                    type: object
                  new_balance:
                    type: number
              example:
                success: true
                message: "Analisi di mercato acquistata con successo"
                analysis:
                  id: 2
                  type: "standard"
                  cost_paid: 50000
                  results:
                    cost_per_flight: 12000
                    monthly_revenue: 350000
                    estimated_profit: 120000
                    analysis_date: "2025-06-29T12:00:00Z"
                    confidence_level: "medium"
                    market_factors:
                      competition: "medium"
                      demand_trend: "growing"
                      seasonal_variation: 18
                  purchase_date: "2025-06-29T12:00:00Z"
                new_balance: 950000
        "400":
          description: Parametri mancanti o fondi insufficienti
        "404":
          description: Compagnia o aeroporti non trovati
        "409":
          description: Analisi già esistente
        "500":
          description: Errore server
  /api/routes/demand-improvements/{origin}/{destination}:
    get:
      tags: [MarketAnalysis]
      summary: Ottieni i miglioramenti domanda per una rotta
      parameters:
        - in: path
          name: origin
          required: true
          schema:
            type: string
        - in: path
          name: destination
          required: true
          schema:
            type: string
        - in: query
          name: company_id
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Lista miglioramenti domanda
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  improvements:
                    type: array
                    items:
                      type: object
              example:
                success: true
                improvements:
                  - id: 1
                    type: "detailed_traffic"
                    cost_paid: 20000
                    results: {}
                    purchase_date: "2025-06-29T12:00:00Z"
                    expires_at: null
        "400":
          description: Parametri mancanti
        "404":
          description: Aeroporti non trovati
        "500":
          description: Errore server
  /api/routes/demand-improvements:
    post:
      tags: [MarketAnalysis]
      summary: Acquista un nuovo miglioramento domanda
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                company_id:
                  type: integer
                origin_airport_code:
                  type: string
                destination_airport_code:
                  type: string
                improvement_type:
                  type: string
                  enum:
                    [detailed_traffic, seasonal_analysis, competitor_analysis]
                cost:
                  type: number
            example:
              company_id: 1
              origin_airport_code: "FCO"
              destination_airport_code: "JFK"
              improvement_type: "detailed_traffic"
              cost: 20000
      responses:
        "200":
          description: Miglioramento acquistato con successo
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  message:
                    type: string
                  improvement:
                    type: object
              example:
                success: true
                message: "Miglioramento domanda acquistato con successo"
                improvement:
                  type: "detailed_traffic"
                  cost_paid: 20000
                  results: {}
        "400":
          description: Parametri mancanti o fondi insufficienti
        "404":
          description: Compagnia o aeroporti non trovati
        "500":
          description: Errore server
  /api/routes/company/{company_id}:
    get:
      tags: [Routes]
      summary: Ottieni tutte le rotte di una compagnia
      parameters:
        - in: path
          name: company_id
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Lista rotte
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  data:
                    type: array
                    items:
                      type: object
  /api/routes/{id}:
    get:
      tags: [Routes]
      summary: Ottieni dettagli di una rotta
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Dettagli rotta e ultimi voli
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  data:
                    type: object
    put:
      tags: [Routes]
      summary: Aggiorna una rotta
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                base_price:
                  type: number
                frequency_per_week:
                  type: integer
                status:
                  type: string
      responses:
        "200":
          description: Rotta aggiornata
    delete:
      tags: [Routes]
      summary: Elimina una rotta
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Rotta eliminata
  /api/routes:
    post:
      tags: [Routes]
      summary: Crea una nuova rotta
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                company_id:
                  type: integer
                origin_airport_id:
                  type: integer
                destination_airport_id:
                  type: integer
                distance_km:
                  type: number
                base_price:
                  type: number
                frequency_per_week:
                  type: integer
      responses:
        "201":
          description: Rotta creata
  /api/routes/{id}/schedule:
    post:
      tags: [Routes]
      summary: Programma un volo su una rotta
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                aircraft_id:
                  type: integer
                departure_time:
                  type: string
                  format: date-time
                passenger_load:
                  type: number
      responses:
        "201":
