<!DOCTYPE html>
<html>
<head>
    <title>Test JS Base</title>
</head>
<body>
    <h1>Test JavaScript Base</h1>
    <p id="result">In attesa...</p>
    
    <script src="test.js"></script>
    <script>
        setTimeout(() => {
            const result = document.getElementById('result');
            if (window.testLoaded) {
                result.textContent = '✅ JavaScript funziona!';
                result.style.color = 'green';
            } else {
                result.textContent = '❌ JavaScript NON funziona!';
                result.style.color = 'red';
            }
        }, 1000);
    </script>
</body>
</html>
