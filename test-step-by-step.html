<!DOCTYPE html>
<html>
<head>
    <title>Test Caricamento Classi Step by Step</title>
</head>
<body>
    <h1>Test Caricamento Classi</h1>
    <div id="log"></div>
    
    <script>
        function log(message, isError = false) {
            const div = document.createElement('div');
            div.style.color = isError ? 'red' : 'green';
            div.style.fontFamily = 'monospace';
            div.style.margin = '2px 0';
            div.textContent = new Date().toLocaleTimeString() + ': ' + message;
            document.getElementById('log').appendChild(div);
            console.log(message);
        }
        
        // Intercetta errori JavaScript
        window.addEventListener('error', function(e) {
            log('❌ ERRORE JS: ' + e.message + ' in ' + e.filename + ':' + e.lineno, true);
        });
        
        log('🚀 Inizio test caricamento classi...');
    </script>
    
    <!-- Carica una classe per volta e testa -->
    
    <!-- 1. Dati -->
    <script src="src/data/SimpleData.js"></script>
    <script>
        setTimeout(() => {
            if (window.AircraftData && window.AirportData) {
                log('✅ SimpleData caricato');
            } else {
                log('❌ SimpleData fallito', true);
            }
        }, 100);
    </script>
    
    <!-- 2. Utilities -->
    <script src="src/utils/SaveLoad-simple.js"></script>
    <script>
        setTimeout(() => {
            if (window.SaveLoad) {
                log('✅ SaveLoad caricato');
            } else {
                log('❌ SaveLoad fallito', true);
            }
        }, 200);
    </script>
    
    <!-- 3. Entities -->
    <script src="src/entities/Aircraft.js"></script>
    <script>
        setTimeout(() => {
            if (window.Aircraft) {
                log('✅ Aircraft caricato');
            } else {
                log('❌ Aircraft fallito', true);
            }
        }, 300);
    </script>
    
    <script src="src/entities/Airport.js"></script>
    <script>
        setTimeout(() => {
            if (window.Airport) {
                log('✅ Airport caricato');
            } else {
                log('❌ Airport fallito', true);
            }
        }, 400);
    </script>
    
    <script src="src/entities/Route.js"></script>
    <script>
        setTimeout(() => {
            if (window.Route) {
                log('✅ Route caricato');
            } else {
                log('❌ Route fallito', true);
            }
        }, 500);
    </script>
    
    <!-- 4. Core -->
    <script src="src/core/GameState.js"></script>
    <script>
        setTimeout(() => {
            if (window.GameState) {
                log('✅ GameState caricato');
            } else {
                log('❌ GameState fallito', true);
            }
        }, 600);
    </script>
    
    <!-- 5. Managers -->
    <script src="src/managers/FleetManager.js"></script>
    <script>
        setTimeout(() => {
            if (window.FleetManager) {
                log('✅ FleetManager caricato');
            } else {
                log('❌ FleetManager fallito', true);
            }
        }, 700);
    </script>
    
    <!-- Test finale -->
    <script>
        setTimeout(() => {
            log('🏁 Test completato. Controlla i risultati sopra.');
        }, 1000);
    </script>
    
</body>
</html>
