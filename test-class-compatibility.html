<!DOCTYPE html>
<html>
<head>
    <title>Test Classi ES5/ES6</title>
</head>
<body>
    <h1>Test Compatibilità Classi</h1>
    <div id="results"></div>
    
    <script src="test-classes.js"></script>
    <script>
        setTimeout(() => {
            const results = document.getElementById('results');
            let html = '';
            
            // Test ES5
            try {
                const es5Instance = new TestClassES5();
                html += '<p style="color: green;">✅ ES5 Class: ' + es5Instance.getName() + '</p>';
            } catch (e) {
                html += '<p style="color: red;">❌ ES5 Class Error: ' + e.message + '</p>';
            }
            
            // Test ES6
            try {
                const es6Instance = new TestClassES6();
                html += '<p style="color: green;">✅ ES6 Class: ' + es6Instance.getName() + '</p>';
            } catch (e) {
                html += '<p style="color: red;">❌ ES6 Class Error: ' + e.message + '</p>';
            }
            
            // Test AircraftData se disponibile
            if (window.AircraftData) {
                html += '<p style="color: green;">✅ AircraftData disponibile</p>';
            } else {
                html += '<p style="color: orange;">⚠️ AircraftData non disponibile</p>';
            }
            
            results.innerHTML = html;
        }, 1000);
    </script>
</body>
</html>
