<!-- /Client/pages/templates/route-panels.html -->

<template id="route-create-panel">
  <div class="route-panel">
    <h3>Crea Nuova Rotta</h3>
    <form id="route-create-form">
      <label for="origin-airport">Aeroporto di partenza</label>
      <select id="origin-airport"></select>
      <label for="destination-airport">Destinazione</label>
      <select id="destination-airport"></select>
      <label for="route-aircraft">Aeromobile</label>
      <select id="route-aircraft"></select>
      <button type="submit">Conferma Rotta</button>
    </form>
  </div>
</template>

<template id="route-edit-panel">
  <div class="route-panel">
    <h3>Modifica Rotta</h3>
    <form id="route-edit-form">
      <!-- Campi per modifica rotta -->
      <button type="submit">Salva Modifiche</button>
    </form>
  </div>
</template>
