<!-- Modale Nuovo Gioco -->
<div id="new-game-modal" class="modal hidden">
    <div class="modal-content">
        <div class="modal-header">
            <h3>🆕 Nuovo Gioco</h3>
            <button id="close-modal" class="close-btn">×</button>
        </div>
        <form id="new-game-form" class="modal-body">
            <div class="input-group">
                <label for="save-name">💾 Nome Salvataggio</label>
                <input type="text" id="save-name" name="saveName" required placeholder="es. Partita Europa 2024">
            </div>
            <div class="input-group">
                <label for="company-name-input">🏢 Nome Compagnia</label>
                <input type="text" id="company-name-input" name="companyName" required>
            </div>
            <div class="input-group">
                <label for="starting-airport">🏢 Hub di Partenza</label>
                <input type="hidden" id="starting-airport" name="startingAirport" required />
                <div id="selected-hub-summary" class="selected-hub-summary">Nessun hub selezionato</div>
                <button type="button" id="open-hub-modal-btn" class="action-btn secondary">🌍 Scegli Hub di Partenza</button>
                <small class="input-help">Scegli tra i principali aeroporti internazionali. Il tuo primo hub sarà gratuito e completamente attrezzato</small>
            </div>
            <div class="input-group">
                <label for="scenario">📅 Scenario Storico</label>
                <select id="scenario" name="scenario" required>
                    <option value="aviation_dawn" selected>🛩️ Inizio epoca del trasporto aereo (1950)</option>
                    <option value="jet_age">✈️ Era dei jet commerciali (1970)</option>
                    <option value="deregulation">🌍 Deregolamentazione globale (1990)</option>
                    <option value="modern_era">🚀 Era moderna (2024)</option>
                </select>
                <small class="input-help">Ogni scenario offre tecnologie, aerei e condizioni di mercato specifiche dell'epoca</small>
            </div>
            <div class="input-group">
                <label for="difficulty">🎯 Difficoltà</label>
                <select id="difficulty" name="difficulty" required>
                    <option value="easy">🟢 Facile - Budget iniziale alto</option>
                    <option value="normal" selected>🟡 Normale - Budget bilanciato</option>
                    <option value="hard">🔴 Difficile - Budget limitato</option>
                </select>
            </div>
            <div class="modal-actions">
                <button type="button" id="cancel-new-game" class="action-btn secondary">❌ Annulla</button>
                <button type="submit" class="action-btn primary">🚀 Inizia Gioco</button>
            </div>
        </form>
    </div>
</div>
