<!-- Modale Conferma Eliminazione -->
<div id="delete-modal" class="modal hidden">
    <div class="modal-content">
        <div class="modal-header">
            <h3>🗑️ Elimina Salvataggio</h3>
            <button id="close-delete-modal" class="close-btn">×</button>
        </div>
        <div class="modal-body">
            <p>Sei sicuro di voler eliminare il salvataggio <strong id="delete-save-name"></strong>?</p>
            <p class="warning-text">⚠️ Questa azione non può essere annullata!</p>
            <div class="modal-actions">
                <button id="cancel-delete" class="action-btn secondary">❌ Annulla</button>
                <button id="confirm-delete" class="action-btn danger">🗑️ Elimina</button>
            </div>
        </div>
    </div>
</div>
