<!-- Panel impostazioni (iniettato dentro il container #settings-overlay presente nella pagina) -->
<div id="settings-panel">
    <h2>⚙️ Impostazioni</h2>
    <div class="settings-buttons">
        <button class="settings-btn menu" id="back-to-menu">Torna al Menu</button>
        <button class="settings-btn danger logout" id="logout-btn">Log Out</button>
        <button class="settings-btn" id="db-viewer-btn" style="background: linear-gradient(135deg, #17a2b8 0%, #138496 100%); color: white;">🗄️ Visualizza Database</button>
        <button class="settings-btn secondary back" id="back-to-game">Ritorna alla Partita</button>
    </div>
</div>
