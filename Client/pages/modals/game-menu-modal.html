<!-- Modale menu di gioco -->
<div id="game-menu-modal" class="modal hidden">
    <div class="modal-content">
        <div class="modal-header">
            <h3>⚙️ Menu di Gioco</h3>
            <button id="close-game-menu" class="close-btn">×</button>
        </div>
        <div class="modal-body">
            <div class="menu-options">
                <button id="return-to-game-select" class="menu-btn secondary">🔙 Torna alla Selezione Giochi</button>
                <button id="game-settings" class="menu-btn secondary">⚙️ Impostazioni</button>
                <button id="logout-from-game" class="menu-btn danger">🚪 Logout</button>
            </div>
            <div class="game-info">
                <h4>📊 Informazioni Partita</h4>
                <p><strong>Salvataggio:</strong> <span id="current-save-name">--</span></p>
                <p><strong>Compagnia:</strong> <span id="current-company-name">--</span></p>
                <p><strong>Tempo di gioco:</strong> <span id="play-time">--</span></p>
                <p><strong>Ultimo salvataggio:</strong> <span id="last-save-time">--</span></p>
            </div>
        </div>
    </div>
</div>
